# Deploy de un agente a Bedrock AgentCore Runtime.
#
# El equivalente de deploy-lambda.yml para los agentes. Hace UNA cosa: apuntar
# un runtime que ya existe a una imagen nueva. No lo crea — el runtime, su rol
# y su configuración los owna terraform (infraestructure/app/stacks/
# agent-runtimes). Acá sólo se mueve la imagen, igual que deploy-lambda mueve
# el `image_uri` de una Lambda que terraform declaró.
#
# ── LAS DOS TRAMPAS, Y POR QUÉ ESTE WORKFLOW ES MÁS LARGO DE LO ESPERABLE ───
#
# 1. `UpdateAgentRuntime` PIERDE los campos que no le mandás.
#
#    No es un PATCH: es un PUT. Si mandás sólo el `containerUri`, el runtime se
#    queda sin `protocolConfiguration` y sin sus variables de entorno, y deja de
#    responder — con un deploy que salió verde. Por eso el paso `read` lee el
#    runtime vivo primero y el `update` le devuelve TODO lo que leyó.
#
#    "TODO" cuesta más de lo que parece: la primera versión de este workflow
#    reenviaba tres campos y se comía `description`. Lo encontró un
#    `terraform plan` en CI, no una persona — un runtime sin description
#    funciona igual, así que no hay síntoma que mirar. Si algún día
#    UpdateAgentRuntime acepta un campo nuevo, va a pasar de nuevo.
#
#    Es exactamente lo que documenta la implementación de referencia
#    (datalake-agentcore): "el deploy no decide el protocolo: lee el
#    protocolConfiguration del runtime vivo y se lo devuelve tal cual, porque
#    UpdateAgentRuntime lo perdería".
#
# 2. Un 200 de la API NO significa que el runtime esté corriendo la imagen.
#
#    `UpdateAgentRuntime` devuelve enseguida; el runtime tarda en pasar a READY,
#    y puede quedar en CREATE_FAILED con el deploy ya en verde. Por eso el paso
#    `verify` espera el estado terminal Y compara el `containerUri` vivo contra
#    el que se pidió. Un deploy que miente es peor que uno que falla: la señal
#    de que algo anda mal aparece recién cuando alguien usa el agente.

name: Deploy AgentCore

on:
  workflow_call:
    inputs:
      runtime-id:
        required: true
        type: string
        description: 'ID del runtime, p.ej. korz_staging_planner_agent-aCS8tX7nr2'
      image-uri:
        required: true
        type: string
        description: 'La imagen a desplegar, con tag inmutable (NO :latest)'
      aws-region:
        required: false
        type: string
        default: 'us-east-2'
      wait-seconds:
        required: false
        type: number
        default: 300
        description: 'Cuánto esperar a que el runtime llegue a un estado terminal'
    secrets:
      AWS_ROLE_ARN_STAGING:
        required: true

jobs:
  deploy:
    runs-on: ${{ vars.KORZ_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}', vars.KORZ_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || fromJSON(vars.KORZ_BUILD_RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20

    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ inputs.aws-region }}

      # ── 1. Leer el runtime vivo ──────────────────────────────────────────
      - name: Leer la configuración actual del runtime
        id: read
        env:
          RID: ${{ inputs.runtime-id }}
          REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail

          aws bedrock-agentcore-control get-agent-runtime \
            --agent-runtime-id "$RID" --region "$REGION" > live.json

          # Estos CUATRO se PIERDEN si no se reenvían. Ver la cabecera.
          jq -c '.protocolConfiguration' live.json > proto.json
          jq -c '.networkConfiguration'  live.json > net.json
          jq -c '.environmentVariables // {}' live.json > env.json
          ROLE=$(jq -r '.roleArn' live.json)
          OLD=$(jq -r '.agentRuntimeArtifact.containerConfiguration.containerUri' live.json)
          # `description` es el cuarto, y se descubrio tarde: un plan de
          # terraform sobre el runtime vivo mostro que terraform queria volver a
          # ponerla porque este deploy se la habia comido. Sin ese plan nadie lo
          # hubiera visto: un runtime sin description funciona igual.
          #
          # Puede no existir, y mandar --description "" borraria una que si
          # existe en otro runtime. Por eso el flag se arma condicional.
          DESC=$(jq -r '.description // ""' live.json)

          echo "role=$ROLE"      >> "$GITHUB_OUTPUT"
          echo "old-image=$OLD"  >> "$GITHUB_OUTPUT"
          echo "description=$DESC" >> "$GITHUB_OUTPUT"

          echo "### Runtime antes del deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- imagen: \`$OLD\`"           >> "$GITHUB_STEP_SUMMARY"
          echo "- protocolo: \`$(cat proto.json)\`" >> "$GITHUB_STEP_SUMMARY"

      # ── 2. Rechazar :latest ──────────────────────────────────────────────
      - name: Exigir un tag inmutable
        env:
          IMAGE: ${{ inputs.image-uri }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            *:latest)
              echo "::error::se pidió desplegar '$IMAGE'. Un tag móvil hace que"
              echo "::error::el runtime y el registro puedan discrepar sin que"
              echo "::error::nada lo note, y vuelve imposible saber qué está"
              echo "::error::corriendo. Usá el tag con SHA o timestamp."
              exit 1
              ;;
          esac

      # ── 3. Actualizar, devolviendo TODO lo leído ─────────────────────────
      - name: Actualizar el runtime
        env:
          RID: ${{ inputs.runtime-id }}
          REGION: ${{ inputs.aws-region }}
          IMAGE: ${{ inputs.image-uri }}
          ROLE: ${{ steps.read.outputs.role }}
          DESC: ${{ steps.read.outputs.description }}
        run: |
          set -euo pipefail

          # Array y no string: una description con espacios se partiria en
          # varios argumentos si se interpolara a mano.
          #
          # `if` y no `[ -n "$DESC" ] && ...`: con set -e, un && cuya condicion
          # da falso siendo el ultimo comando mata el script. El deploy fallaria
          # justo cuando el runtime NO tiene description, que es el caso comun.
          EXTRA=()
          if [ -n "$DESC" ]; then
            EXTRA+=(--description "$DESC")
          fi

          aws bedrock-agentcore-control update-agent-runtime \
            --agent-runtime-id "$RID" \
            --region "$REGION" \
            --role-arn "$ROLE" \
            --agent-runtime-artifact "$(jq -nc --arg u "$IMAGE" \
                '{containerConfiguration:{containerUri:$u}}')" \
            --network-configuration "file://net.json" \
            --protocol-configuration "file://proto.json" \
            --environment-variables "file://env.json" \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            > updated.json

          echo "versión nueva: $(jq -r '.agentRuntimeVersion' updated.json)"

      # ── 4. Verificar que quedó corriendo LO QUE SE PIDIÓ ─────────────────
      - name: Esperar READY y confirmar la imagen
        env:
          RID: ${{ inputs.runtime-id }}
          REGION: ${{ inputs.aws-region }}
          IMAGE: ${{ inputs.image-uri }}
          DEADLINE: ${{ inputs.wait-seconds }}
        run: |
          set -euo pipefail

          elapsed=0
          while [ "$elapsed" -lt "$DEADLINE" ]; do
            aws bedrock-agentcore-control get-agent-runtime \
              --agent-runtime-id "$RID" --region "$REGION" > now.json
            STATUS=$(jq -r '.status' now.json)

            case "$STATUS" in
              READY) break ;;
              CREATE_FAILED|UPDATE_FAILED|DELETING)
                echo "::error::el runtime terminó en $STATUS"
                jq . now.json
                exit 1
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          if [ "$STATUS" != "READY" ]; then
            echo "::error::el runtime sigue en $STATUS después de ${DEADLINE}s"
            exit 1
          fi

          # El chequeo que impide un deploy que miente: la API dijo 200, pero
          # ¿está corriendo la imagen que pedimos?
          RUNNING=$(jq -r '.agentRuntimeArtifact.containerConfiguration.containerUri' now.json)
          if [ "$RUNNING" != "$IMAGE" ]; then
            echo "::error::el runtime está READY pero con OTRA imagen."
            echo "::error::  pedida:    $IMAGE"
            echo "::error::  corriendo: $RUNNING"
            exit 1
          fi

          # Y que no se haya perdido el protocolo en el camino.
          PROTO=$(jq -r '.protocolConfiguration.serverProtocol // "AUSENTE"' now.json)
          if [ "$PROTO" = "AUSENTE" ]; then
            echo "::error::el runtime quedó sin protocolConfiguration."
            echo "::error::UpdateAgentRuntime lo perdió — el paso de lectura no"
            echo "::error::se lo devolvió. Ver la cabecera de este workflow."
            exit 1
          fi

          {
            echo "### Deploy confirmado"
            echo "- imagen: \`$RUNNING\`"
            echo "- versión: \`$(jq -r '.agentRuntimeVersion' now.json)\`"
            echo "- protocolo: \`$PROTO\` (preservado)"
            echo "- estado: \`$STATUS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 5. Avisar ────────────────────────────────────────────────────────
      #
      # Ocho repos ya notifican desde deploy-lambda y web-client no lo hacía —
      # se descubrió cuando un deploy falló en silencio. No repetir eso acá
      # desde el primer día.
      #
      # Slack, no Discord (KOR-374). Mismo canal que el resto de los deploys:
      # #korz-deploys, privado.
      - name: Leer el token de Slack
        id: slack
        if: always()
        continue-on-error: true
        # SIN `|| true`. El linter de este repo lo prohibe y tiene razon: un
        # exit code tragado esconde TODOS los fallos del paso, no solo el que
        # uno tenia en mente. `continue-on-error` arriba ya dice que este paso
        # es opcional, que es el mecanismo correcto — si el parametro no
        # existe, el paso falla, el job sigue, y el `token` queda vacio, con
        # lo cual el paso de notificar se saltea solo.
        run: |
          # --region us-east-1 A PROPOSITO, y no el de este workflow: los
          # parametros de Slack viven SOLO en us-east-1 y el rol de CI tiene
          # el permiso acotado a esa region. Sin esto el paso muere con
          # AccessDeniedException sobre un ARN de us-east-2 — que es lo que paso
          # en el primer deploy real de korz-agents. deploy-lambda.yml ya lo
          # pasa; este workflow se escribio sin mirarlo.
          TOKEN=$(aws ssm get-parameter \
            --name /korz/slack-bot-token \
            --with-decryption \
            --region us-east-1 \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: "Notificar a #korz-deploys"
        if: always() && steps.slack.outputs.token != ''
        continue-on-error: true
        env:
          TOKEN: ${{ steps.slack.outputs.token }}
          # C0C0KAX1TN1 es #korz-deploys.
          CHANNEL: C0C0KAX1TN1
          STATUS: ${{ job.status }}
          RUNTIME: ${{ inputs.runtime-id }}
          IMAGE: ${{ inputs.image-uri }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Lo que se muestra es lo que CAMBIA entre un deploy y el siguiente.
          #
          # La URI entera de ECR es
          # 642917032014.dkr.ecr.us-east-2.amazonaws.com/korz-agents:<tag>, y de
          # esos 60 caracteres los primeros 50 son idénticos en todos los
          # deploys de la historia. Puestos en el mensaje empujan el tag —lo
          # único que distingue este deploy del anterior— al final de una línea
          # que envuelve. Queda `repo:tag`.
          IMAGE_SHORT="${IMAGE##*/}"

          # El runtime-id es <nombre>-<id de AgentCore>. El nombre dice qué
          # agente es; el sufijo sólo sirve para pegarlo en la consola de AWS,
          # así que va al pie y no en el título.
          RUNTIME_NAME="${RUNTIME%-*}"
          RUNTIME_ID="${RUNTIME##*-}"

          # korz_staging_self_healer_agent -> env "staging", agente "self healer
          # agent". El prefijo y el guion bajo se repetían en cada mensaje sin
          # aportar nada. Si el nombre no tiene esa forma, se muestra entero.
          case "$RUNTIME_NAME" in
            korz_*_*)
              ENVNAME="$(printf '%s' "$RUNTIME_NAME" | cut -d_ -f2)"
              AGENT="$(printf '%s' "$RUNTIME_NAME" | cut -d_ -f3- | tr '_' ' ')"
              ;;
            *)
              ENVNAME="?"; AGENT="$RUNTIME_NAME"
              ;;
          esac

          if [ "$STATUS" = "success" ]; then
            ICON=":rocket:"; COLOR="#2eb886"; ESTADO=""
            TITLE="$AGENT desplegado a $ENVNAME"
          else
            ICON=":rotating_light:"; COLOR="#e01e5a"; ESTADO="  ·  *FALLÓ*"
            TITLE="$AGENT FALLÓ a $ENVNAME"
          fi

          # Sin bloque `header`: renderiza en un cuerpo grande que con un nombre
          # de runtime largo envuelve en tres renglones y ocupa media pantalla
          # para decir una cosa. Una `section` en negrita dice lo mismo en un
          # renglón.
          # LA BARRA DE COLOR VA EN `attachments`, NO EN `blocks`.
          #
          # Es el borde verde/rojo de la izquierda, y es lo que hace que un
          # deploy se distinga de un párrafo gris cualquiera al scrollear. Con
          # `blocks` sueltos no hay forma de pintarla.
          #
          # Y el `text` de nivel raíz NO es sólo la notificación push: cuando
          # hay attachments, Slack lo DIBUJA como una línea extra encima. Poner
          # ahí el título lo duplicaba. El fallback de la notificación va en
          # `attachments[].fallback`, que no se dibuja.
          jq -n \
            --arg channel "$CHANNEL" \
            --arg fallback "$TITLE" \
            --arg color "$COLOR" \
            --arg icon "$ICON" \
            --arg agent "$AGENT" \
            --arg env "$ENVNAME" \
            --arg estado "$ESTADO" \
            --arg image "$IMAGE_SHORT" \
            --arg rid "$RUNTIME_ID" \
            --arg sha "${SHA:0:7}" \
            --arg commit_url "$COMMIT_URL" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            '{channel: $channel,
              attachments: [{
                color: $color,
                fallback: $fallback,
                blocks: [
                  {type: "section",
                   text: {type: "mrkdwn",
                          text: "\($icon)  *\($agent)*  →  `\($env)`\($estado)\n`\($image)`"}},
                  {type: "context", elements: [
                    {type: "image",
                     image_url: "https://github.com/\($actor).png?size=32",
                     alt_text: $actor},
                    {type: "mrkdwn",
                     text: "*\($actor)* · <\($commit_url)|`\($sha)`> · runtime `\($rid)` · <\($run_url)|ver el run>"}
                  ]}
                ]}]}' > /tmp/slack.json
          # LA WEB API DE SLACK CONTESTA HTTP 200 CUANDO FALLA.
          # `{"ok":false,"error":"invalid_auth"}` viaja en un 200, asi que
          # `curl -f` lo deja pasar y el paso queda verde. Se mira `.ok`.
          #
          # `nofail: true` de la action anterior no tiene equivalente ni hace
          # falta: `continue-on-error` ya impide que esto bloquee el deploy, y
          # lo que se gana es que un token roto se VEA en rojo.
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/slack.json)
          if [ "$(printf '%s' "$RESP" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack rechazo el aviso: $(printf '%s' "$RESP" | jq -r '.error // "respuesta ilegible"')"
            exit 1
          fi
