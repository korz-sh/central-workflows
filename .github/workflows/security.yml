name: Security

# The org's security gate over OUR OWN code (KOR-245). The scans themselves live
# in korz-sh/central-workflows/.github/actions/{semgrep,supply-chain}-scan --
# including why they are composite actions and not a reusable workflow. Keep this
# file thin: it was copy-pasted into 13 repos and all 13 copies drifted.
#
# `pull_request` with no `branches` filter: default branches are not uniform
# across the org (some main, some master) and a wrong filter leaves the workflow
# never running, which in the UI looks identical to a green workflow.
#
# `develop` is gone from the push list: it survived in 3 of 13 repos and was 0
# commits ahead in 2 of them. The trigger described a flow nobody used.
# LOS SCANS NO CORREN EN CADA PR (KOR-345).
#
# Un scan de SAST/supply-chain mira el árbol ENTERO, no el diff: correrlo por PR
# repite el mismo trabajo sobre el mismo código. En el runner self-hosted eso era
# ~1/3 de la cola — medido en web-api, 96% del reloj de un CI era espera (93 min
# de cola contra 4 de ejecución real).
#
# Corre donde el resultado cambia algo:
#   - push a la rama por defecto: lo que efectivamente se despliega
#   - schedule semanal: una CVE nueva aparece sin que nadie toque el código, y
#     ese caso el scan por PR NUNCA lo cubrió
#   - workflow_dispatch: a mano, antes de un release o al revisar un hallazgo
#
# HIZO FALTA APAGAR UNA RULESET DE ORG ("korz security gate", id 20664553) que
# exigía `sast` y `supply-chain` como checks requeridos en los 13 repos. Un check
# requerido que nunca reporta no falla el PR: lo deja BLOCKED para siempre. Ese
# fue el primer intento y por eso se revirtió.
#
# La ruleset quedó `enforcement: disabled` con sus reglas intactas, así que
# volver a exigirlos es cambiar ese único campo.
#
# Se pierde el scan de una rama antes de mergear. A cambio, el push a la rama por
# defecto lo scanea igual y el hallazgo aparece minutos después.
on:
  push:
    # Sólo `main`: es la rama por defecto de ESTE repo y `master` no existe acá.
    # Listar las dos venía de que la org es mixta (algunos repos main, otros
    # master), pero un filtro con una rama inexistente no protege nada — sólo
    # sugiere que hay un flujo que no existe.
    branches: [main]
  workflow_dispatch:
  schedule:
    # lunes 06:00 UTC — CVEs nuevas sobre código que nadie tocó.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: sast
    # Native Semgrep: hosted-first when enabled, otherwise the security profile.
    runs-on: ${{ (github.event.repository.private == false || vars.KORZ_RUNNER_BACKEND == 'github') && 'ubuntu-latest' || vars.KORZ_SECURITY_RUNNER_LABELS != '' && fromJSON(vars.KORZ_SECURITY_RUNNER_LABELS) || vars.KORZ_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}', vars.KORZ_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || fromJSON(vars.KORZ_BUILD_RUNNER_LABELS || '"ubuntu-latest"') }}
    # Nothing in this org had a timeout before. A hung job on a self-hosted
    # runner holds the runner until the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Local path, not `korz-sh/central-workflows/...@main`. This repo OWNS the
      # action, so pinning itself to its own default branch means a PR that adds
      # or changes an action is validated against the OLD copy on main -- and on
      # the PR that first introduced them, against a copy that did not exist yet:
      #
      #   Can't find 'action.yml' ... for action
      #   'korz-sh/central-workflows/.github/actions/semgrep-scan@main'
      #
      # A relative path resolves inside the checkout, so this gate tests the
      # actions as the PR leaves them. Consumers still pin @main, which is what
      # they want: the released copy, not someone's branch.
      - uses: ./.github/actions/semgrep-scan
        with:
          # Ticketed debt only -- everything else blocks. Review on the date
          # in this repo's .trivyignore.
          #   yaml.github-actions.security.run-shell-injection.run-shell-injection
          #   yaml.github-actions.security.secrets-inherit.secrets-inherit  ->  KOR-251
          exclude-rules: >-
            yaml.github-actions.security.run-shell-injection.run-shell-injection
            yaml.github-actions.security.secrets-inherit.secrets-inherit

  supply-chain:
    name: supply-chain
    # KOR-320, same as above.
    runs-on: ${{ (github.event.repository.private == false || vars.KORZ_RUNNER_BACKEND == 'github') && 'ubuntu-latest' || fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Local path, same reason as the sast job above.
      - uses: ./.github/actions/supply-chain-scan

  # A cancelled job is not a green job (KOR-340).
  #
  # When GitHub kills a job for exceeding timeout-minutes it marks it
  # `cancelled`, not `failure` — and a run whose only non-success job is
  # cancelled does not block a merge. So a scan that never ran and a scan that
  # found nothing look identical from the outside: no findings either way.
  #
  # Found in entitlement-api, which had 2 cancelled Security runs out of 8, days
  # apart, with nobody noticing either one. Measured sast duration on a quiet
  # runner is 23-34s; the run that got killed had been going for over 19 minutes
  # because the self-hosted box was running three jobs and a docker build at
  # once. The timeout is not miscalibrated — but the failure mode is the same
  # either way: silence read as approval. This file is copy-pasted across the
  # org, so every repo had the same hole.
  #
  # This job turns that silence into a red run. It cannot itself be skipped:
  # `if: always()` runs it even when a dependency is cancelled or failed.
  gate:
    name: gate
    needs: [sast, supply-chain]
    if: always()
    runs-on: ${{ (github.event.repository.private == false || vars.KORZ_RUNNER_BACKEND == 'github') && 'ubuntu-latest' || vars.KORZ_UTILITY_RUNNER_LABELS != '' && fromJSON(vars.KORZ_UTILITY_RUNNER_LABELS) || fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Every scan must have actually run
        env:
          SAST: ${{ needs.sast.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        run: |
          set -euo pipefail
          rc=0
          for scan in SAST SUPPLY_CHAIN; do
            result="${!scan}"
            if [ "$result" != "success" ]; then
              echo "::error::$scan did not run to completion (result: $result)"
              rc=1
            else
              echo "$scan: success"
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::A scan that did not run is not a scan that passed."
            exit 1
          fi

      # Un scan rojo que nadie ve es igual a un scan verde (la lección de
      # KOR-340, una capa más arriba). #korz-security en Slack recibe SOLO
      # fallas: sast/supply-chain con hallazgos, o scans que no corrieron.
      # El caso schedule es el que importa: una CVE nueva aparece un lunes a
      # las 06:00 sin que nadie toque código ni mire Actions.
      # El token viene de SSM (us-east-1, junto al resto); si el parámetro no
      # existe el paso se saltea sin romper el gate.
      #
      # El canal es PRIVADO a propósito (KOR-374): este mensaje lleva el nombre
      # de un repo privado y si hubo hallazgos, y el Slack de korz.sh es
      # comunitario — entran partners y clientes.
      - name: Configure AWS credentials (for the Slack token)
        if: failure()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1
        continue-on-error: true
      - name: Notify security channel
        if: failure()
        continue-on-error: true
        env:
          SAST: ${{ needs.sast.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          # C0C08FQ1J87 es #korz-security. Va el ID y no el nombre: renombrar
          # un canal no debe romper el aviso en 15 repos a la vez.
          CHANNEL: C0C08FQ1J87
        run: |
          # Sin || ni fallback: el paso entero es continue-on-error, así que
          # un SSM sin parámetro o sin permiso queda VISIBLE como paso rojo
          # (no bloquea el gate) en vez de tragado — la notificación de
          # deploys estuvo muerta en silencio meses por el patrón || echo.
          TOKEN=$(aws ssm get-parameter \
            --name /korz/slack-bot-token \
            --with-decryption --query 'Parameter.Value' --output text \
            --region us-east-1)
          echo "::add-mask::$TOKEN"
          # Block Kit en vez de texto pelado: el canal se lee de un vistazo y el
          # scan semanal —el que nadie está mirando cuando aparece una CVE—
          # se distingue del push a mano.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ORIGIN="🗓️ Scan semanal — CVE nueva sobre código que nadie tocó"
          else
            ORIGIN="push a \`${{ github.ref_name }}\` por ${{ github.actor }}"
          fi
          # `case`, no `[ ] && echo || echo`: el gate de este repo prohíbe
          # `|| echo` en workflows (traga exit codes) y tiene razón — acá
          # sería formateo de strings, pero un patrón prohibido con una
          # excepción deja de ser un patrón.
          fmt() {
            case "$1" in
              success) echo "✅ limpio" ;;
              failure) echo "🔴 hallazgos" ;;
              *) echo "⚠️ $1" ;;
            esac
          }
          # `text` además de `blocks`: es lo que Slack manda en la notificación
          # push y lo único que queda si un bloque no renderiza. Un mensaje que
          # llega vacío se lee igual que ningún mensaje.
          # LA BARRA DE COLOR VA EN `attachments`, NO EN `blocks`.
          #
          # Es el borde rojo de la izquierda, y en un canal que sólo recibe
          # fallas es lo que hace que el mensaje se lea como una alarma y no
          # como un párrafo gris más. Con `blocks` sueltos no se puede pintar.
          #
          # Y el `text` de nivel raíz NO es sólo la notificación push: con
          # attachments presentes, Slack lo DIBUJA como una línea extra encima.
          # El fallback va en `attachments[].fallback`, que no se dibuja.
          jq -n \
            --arg channel "$CHANNEL" \
            --arg repo "${{ github.repository }}" \
            --arg reponame "${{ github.event.repository.name }}" \
            --arg origin "$ORIGIN" \
            --arg sast "$(fmt "$SAST")" \
            --arg sc "$(fmt "$SUPPLY_CHAIN")" \
            --arg actor "${{ github.actor }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{channel: $channel,
              attachments: [{
                color: "#e01e5a",
                fallback: "\($repo) — SAST \($sast) · supply-chain \($sc)",
                blocks: [
                  {type: "section",
                   text: {type: "mrkdwn",
                          text: ":lock:  *\($reponame)*\n\($origin)"}},
                  {type: "section", fields: [
                    {type: "mrkdwn", text: "*SAST* (semgrep)\n\($sast)"},
                    {type: "mrkdwn", text: "*Supply chain* (trivy)\n\($sc)"}
                  ]},
                  {type: "context", elements: [
                    {type: "image",
                     image_url: "https://github.com/\($actor).png?size=32",
                     alt_text: $actor},
                    {type: "mrkdwn",
                     text: "<\($url)|ver el run> · los hallazgos completos están en el log del job"}
                  ]}
                ]}]}' > /tmp/slack.json
          # LA WEB API DE SLACK CONTESTA HTTP 200 CUANDO FALLA.
          #
          # `{"ok":false,"error":"invalid_auth"}` viaja en un 200, así que
          # `curl -f` lo deja pasar y el paso queda verde. Un token revocado,
          # un canal archivado o un bot expulsado se verían exactamente igual
          # que un aviso entregado — el fake pass de siempre, una capa más
          # abajo. Se mira `.ok`, que es la única respuesta honesta que da.
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/slack.json)
          if [ "$(printf '%s' "$RESP" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack rechazó el aviso: $(printf '%s' "$RESP" | jq -r '.error // "respuesta ilegible"')"
            exit 1
          fi
