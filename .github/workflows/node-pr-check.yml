name: PR Check Node (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      package-manager:
        required: false
        type: string
        default: 'npm'
        description: 'npm or pnpm'
      pnpm-version:
        required: false
        type: string
        default: '9.1.4'
      codecov-flag:
        required: false
        type: string
        default: ''
      run-e2e:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm run lint' || 'npm run lint' }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm run build' || 'npm run build' }}

  test:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
      # KOR-155: this used to end in `|| echo "Tests completed"`, which replaced
      # the exit code with 0 — the job was green whether the tests passed or
      # failed. payments-service-api's suite CRASHES today (an async function
      # tested with expect(...).toThrow() leaves an unhandled rejection that kills
      # the Jest worker) and CI never said so. See KOR-159.
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm run test:coverage' || 'npm run test' }}

      - uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: ${{ inputs.codecov-flag }}
          fail_ci_if_error: false

  e2e:
    if: ${{ inputs.run-e2e }}
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm exec playwright install --with-deps' || 'npx playwright install --with-deps' }}
      # KOR-155: same swallowed exit code as the unit tests above. An e2e suite
      # that cannot fail is worse than no e2e suite, because it costs minutes AND
      # manufactures confidence.
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm run test:e2e' || 'npm run test:e2e' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
