name: PR Check Go (Reusable)

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: '1.22'

jobs:
  test:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go-version }}
      - run: go mod download
      - run: go test -v -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out

  build:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go-version }}
      - run: go mod download
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bootstrap ./cmd/server
      # KOR-155 note: the `|| echo` here is NOT the same defect as the swallowed
      # test gates. `go build` above is the real check and its exit code is
      # honoured; this line only confirms the artifact exists and is executable.
      #
      # `./bootstrap --version` is best-effort on purpose — a Lambda bootstrap
      # binary has no obligation to implement a --version flag, and demanding one
      # would fail builds over a convention nobody agreed to. So the `file` call
      # is the assertion and the invocation is informational.
      #
      # Split in two so the part that must hold, holds.
      - name: The binary exists and is executable
        run: |
          test -x bootstrap
          file bootstrap
      # `continue-on-error` rather than `|| echo`, which looks equivalent and
      # is not. `|| echo` REWRITES the exit code to 0, so the step is green
      # whether the binary printed a version or segfaulted, and no reader can
      # tell the difference. continue-on-error keeps the real exit code, shows
      # the step as failed in the UI, and simply does not fail the job.
      #
      # It also means the repo holds no line that swallows an exit code, so the
      # drift detector needs no exception. A detector with exceptions is one
      # nobody trusts, and this rule exists because `dotnet test || echo "No
      # tests found"` hid a broken suite behind a green tick.
      - name: Version banner, if the binary offers one
        continue-on-error: true
        run: ./bootstrap --version

  lint:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go-version }}
      # golangci-lint 1.64.8 is BUILT with Go 1.24 and refuses to analyse a
      # module targeting a newer language version:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.25.0)
      #
      # identity-api-v2's go.mod declares 1.25.0, so its lint job could not pass
      # no matter what the code looked like.
      #
      # `version: latest` does NOT fix it, and that is the trap: on both v3 and
      # v6 of the action it still resolved to 1.64.8. Bumping the action alone
      # changed nothing — verified, after assuming otherwise and watching the
      # same 1.64.8 binary run again.
      #
      # So pin a v2 release explicitly. Renovate can move this; "latest" cannot,
      # because it does not mean what it looks like it means.
      # v7 is the first action release that accepts golangci-lint v2. v6 rejects
      # it outright:
      #
      #   invalid version string 'v2.12.2', golangci-lint v2 is not supported
      #   by golangci-lint-action v6, you must update to golangci-lint-action v7
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
