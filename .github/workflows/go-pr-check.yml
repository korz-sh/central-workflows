name: PR Check Go (Reusable)

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: '1.22'

jobs:
  test:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go-version }}
      - run: go mod download
      - run: go test -v -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out

  build:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go-version }}
      - run: go mod download
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bootstrap ./cmd/server
      # KOR-155 note: the `|| echo` here is NOT the same defect as the swallowed
      # test gates. `go build` above is the real check and its exit code is
      # honoured; this line only confirms the artifact exists and is executable.
      #
      # `./bootstrap --version` is best-effort on purpose — a Lambda bootstrap
      # binary has no obligation to implement a --version flag, and demanding one
      # would fail builds over a convention nobody agreed to. So the `file` call
      # is the assertion and the invocation is informational.
      #
      # Split in two so the part that must hold, holds.
      - name: The binary exists and is executable
        run: |
          test -x bootstrap
          file bootstrap
      - name: Version banner, if the binary offers one
        run: ./bootstrap --version || echo "(no --version flag — not required)"

  lint:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go-version }}
      # v3 pins golangci-lint 1.64.8, which is BUILT with Go 1.24 and refuses to
      # analyse a module targeting a newer language version:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.25.0)
      #
      # identity-api-v2's go.mod declares 1.25.0, so its lint job could not have
      # passed under v3 no matter what the code looked like. `version: latest`
      # does not help: the ACTION decides which release it can install.
      #
      # v6 ships golangci-lint v2, built against a current toolchain.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
