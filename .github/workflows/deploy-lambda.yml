name: Deploy to Lambda (Reusable)

# Caller must use `on: workflow_run` and pass event context as inputs.
# See each service's deploy.yml for the caller pattern.

on:
  workflow_call:
    inputs:
      health-path:
        required: false
        type: string
        default: '/health'
        description: >-
          Ruta anónima que el smoke test post-deploy consulta. El default sirve
          para los servicios que montan en la raíz; payments-service-api monta
          todo bajo `/internal`, así que necesita `/internal/health`.
      ecr-repo:
        required: true
        type: string
        description: 'ECR repository name (explicit — no derivation from repo name)'
      build-conclusion:
        required: true
        type: string
        description: 'Passed from: github.event.workflow_run.conclusion'
      trigger-branch:
        required: true
        type: string
        description: 'Passed from: github.event.workflow_run.head_branch'
      staging-branch:
        # REQUIRED, with no default, and that is the fix. It defaulted to
        # 'develop', which no consumer's default branch is -- so deploy-staging
        # was skipped on every merge, and a skipped job reads as "nothing to do"
        # rather than "misconfigured". entitlement-api documented having to pass
        # `staging-branch: main` just to undo the default.
        #
        # `extra-staging-branch` is gone with it. It existed only as the escape
        # hatch from that wrong default: identity-api-v2, rbac-api and
        # payments-service-api all left staging-branch on dead 'develop' and put
        # their REAL branch in the extra slot. One explicit input, passed by
        # every caller, removes both the hazard and the workaround.
        required: true
        type: string
        description: "Branch that triggers the staging deploy — the repo's default branch"
      prod-branch:
        required: false
        type: string
        # Production is OPT-IN. This defaulted to 'main', and every consumer's
        # default branch IS main, so every merge attempted a production deploy
        # that nobody asked for.
        #
        # It never worked, and the way it failed is the point. entitlement-api's
        # prod job assumed a role named github-actions-korz-STAGING and targeted
        # `entitlement_api` -- the SAME function the staging job writes. It only
        # failed because that role lacks lambda:UpdateFunctionCode. With the
        # permission, a "prod deploy" would have silently overwritten staging and
        # reported success.
        #
        # Five of the six consumers still have LAMBDA_FUNCTION_PROD identical to
        # LAMBDA_FUNCTION_STAGING, so this is not one repo's misconfiguration.
        #
        # Checked before changing it: across all six consumers, 143 deploy-prod
        # jobs have run and ZERO have ever succeeded. Nothing depends on the old
        # default, so this removes a hazard without stopping a real deployment.
        #
        # To deploy to production, pass `prod-branch: main` explicitly -- and
        # make sure AWS_ROLE_ARN_PROD and LAMBDA_FUNCTION_PROD actually name
        # production first.
        default: ''
        description: 'Branch that triggers prod deploy. Empty (default) disables it; set explicitly to opt in.'
      aws-region-staging:
        required: false
        type: string
        default: 'us-east-2'
      aws-region-prod:
        required: false
        type: string
        default: 'us-east-1'
      create-release-tag:
        required: false
        type: boolean
        default: false
        description: 'Create a git -prod release tag after prod deploy'
    secrets:
      AWS_ROLE_ARN_STAGING:
        required: true
      AWS_ROLE_ARN_PROD:
        required: true

jobs:
  deploy-staging:
    if: |
      inputs.build-conclusion == 'success' &&
      inputs.trigger-branch == inputs.staging-branch
    # Build/deploy corre en GitHub, NO en el self-hosted, aunque el CI sí lo use.
    #
    # KORZ_BUILD_RUNNER_LABELS existe sólo para partir eso en dos. El
    # self-hosted es la máquina de trabajo del dev, y estos jobs son los caros:
    # un `docker build` se come la RAM y deja atrás capas y cachés de buildx —
    # 31 GB de volúmenes huérfanos la última vez, con el disco al 99%.
    #
    # El CI (tests, lint, contract) es liviano y sigue donde diga
    # KORZ_RUNNER_LABELS. Sin la variable nueva, esto cae a ubuntu-latest, que
    # es el default correcto para un repo que no configuró nada.
    # KORZ_CODEBUILD_PROJECT tiene precedencia: el label de CodeBuild exige el
    # run_id interpolado (codebuild-<proyecto>-<run_id>-<run_attempt>) y GitHub
    # NO evalúa ${{ }} dentro de valores de variables, así que el formato se
    # arma acá con format(). Sin esa var, KORZ_BUILD_RUNNER_LABELS como
    # siempre, y sin ninguna, ubuntu-latest.
    runs-on: ${{ vars.KORZ_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}', vars.KORZ_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || fromJSON(vars.KORZ_BUILD_RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ inputs.aws-region-staging }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Lambda function (staging)
        env:
          LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION_STAGING }}
        run: |
          if [ -z "$LAMBDA_FUNCTION" ]; then
            echo "⚠️  LAMBDA_FUNCTION_STAGING not set"
            exit 1
          fi
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repo }}:latest"
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $IMAGE_URI \
            --region ${{ inputs.aws-region-staging }}
          echo "✅ Lambda updated: $IMAGE_URI"

      - name: Wait for Lambda to stabilize
        env:
          LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION_STAGING }}
        run: |
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION \
            --region ${{ inputs.aws-region-staging }}
          echo "✅ Lambda ready"

      # INVOCARLA. `wait function-updated` sólo dice que AWS terminó de cambiar
      # la configuración: no ejecuta el código ni una vez. Una imagen con un
      # import roto, un handler mal nombrado o una dependencia faltante pasa ese
      # wait sin problema, y el deploy se anuncia como éxito en Discord mientras
      # el servicio devuelve 502 a todo el mundo. El primero en enterarse es un
      # usuario.
      #
      # Se pide /health, que es anónimo en todos nuestros servicios. Lo que se
      # exige es que el runtime RESPONDA y que no haya un error de función: un
      # 503 con cuerpo (base caída) es un servicio que arrancó, y eso es lo que
      # este paso verifica. Un FunctionError es la imagen que no levanta.
      - name: La función responde
        env:
          LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION_STAGING }}
          REGION: ${{ inputs.aws-region-staging }}
          HEALTH_PATH: ${{ inputs.health-path }}
        run: |
          set -euo pipefail

          payload="$(printf '%s' '{"version":"2.0","rawPath":"'"${HEALTH_PATH}"'","rawQueryString":"","requestContext":{"http":{"method":"GET","path":"'"${HEALTH_PATH}"'","sourceIp":"127.0.0.1","protocol":"HTTP/1.1","userAgent":"deploy-smoke"},"requestId":"deploy-smoke","stage":"$default","apiId":"smoke","domainName":"smoke","accountId":"0","time":"x","timeEpoch":0},"headers":{"host":"localhost"},"isBase64Encoded":false}' | base64 -w0)"

          # Hasta 5 intentos: el primer invoke paga el cold start de una imagen
          # recién publicada y puede pasarse del timeout del cliente.
          for intento in 1 2 3 4 5; do
            if aws lambda invoke \
                 --function-name "$LAMBDA_FUNCTION" \
                 --region "$REGION" \
                 --payload "$payload" \
                 --cli-read-timeout 60 \
                 /tmp/respuesta.json > /tmp/meta.json 2>/tmp/err.txt; then
              break
            fi
            # AccessDenied NO es la Lambda rota: es que a ESTE rol le falta
            # lambda:InvokeFunction. Reintentar cinco veces y después fallar
            # bloquearía el deploy de los 15 repos por un permiso que todavía no
            # se aplicó, y un gate nuevo que rompe todo es un gate que alguien
            # borra el mismo día.
            #
            # Se avisa fuerte y se sigue: el deploy en sí ya ocurrió, y lo único
            # que se pierde es la verificación — que es exactamente lo que había
            # antes de este paso.
            if [ -f /tmp/err.txt ] && grep -qi "AccessDenied\|not authorized" /tmp/err.txt; then
              echo "::warning::Sin permiso para invocar $LAMBDA_FUNCTION: falta lambda:InvokeFunction en el rol de CI."
              echo "::warning::El deploy siguió, pero NADIE verificó que la imagen arranque."
              echo "::warning::Arreglo: infra/app/stacks/ci-oidc (ya está en el código, falta el apply)."
              exit 0
            fi
            echo "intento $intento falló, reintentando..."
            # `[ -f ]` y no `|| true`: el gate de este repo prohíbe tragarse
            # exit codes, y con razón — un `|| true` acá también escondería que
            # cat falló por otro motivo. El archivo puede no existir si el aws
            # cli murió antes de escribir nada, y eso es normal.
            if [ -f /tmp/err.txt ]; then cat /tmp/err.txt; fi
            sleep 5
          done

          echo "--- respuesta ---"
          if [ -f /tmp/respuesta.json ]; then head -c 500 /tmp/respuesta.json; fi
          echo

          # FunctionError significa que el código explotó: import roto, handler
          # inexistente, dependencia faltante. Es exactamente el fallo que este
          # paso existe para atrapar, y el que `wait function-updated` no ve.
          if grep -q '"FunctionError"' /tmp/meta.json 2>/dev/null; then
            echo "::error::La Lambda respondió con FunctionError — la imagen no arranca."
            echo "::error::$(head -c 800 /tmp/respuesta.json)"
            exit 1
          fi

          if ! grep -q '"statusCode"' /tmp/respuesta.json 2>/dev/null; then
            echo "::error::La respuesta no tiene statusCode: el handler no devolvió una respuesta HTTP."
            exit 1
          fi

          # Un /health que no responde 2xx es un chequeo que no probó nada.
          #
          # Empezó como un guard contra el 404 —payments-service-api monta todo
          # bajo `/internal`, así que `/health` no existía y el paso igual decía
          # "la función arranca y responde"— y se generalizó cuando rbac-api
          # devolvió un 400 "Invalid Hostname" y también pasó.
          #
          # Los dos casos son el mismo: lo único comprobado es que el runtime
          # sabe devolver errores HTTP, y eso lo hace igual una imagen con la app
          # completamente rota. Un /health sano devuelve 200.
          #
          # El 503 también falla, y es un cambio respecto de la primera versión
          # de este paso, que lo dejaba pasar como "arrancó pero la base está
          # caída". Desplegar sobre una base inalcanzable no es un éxito: si el
          # deploy sigue, nadie mira. Prefiero un rojo que se explica en treinta
          # segundos a un verde que oculta un servicio que no puede responder.
          #
          # Verificado contra una imagen ROTA a propósito (un CMD que apunta a
          # un módulo inexistente): construye perfecto, y al invocarla responde
          # `{"errorMessage": "Unable to import module ..."}` sin `statusCode`.
          # Este case la rechaza. Ese es exactamente el fallo que el paso existe
          # para atrapar, y el que `wait function-updated` no ve.
          #
          # Los cinco casos, comprobados:
          #   {"statusCode":200}  -> pasa
          #   {"statusCode":204}  -> pasa
          #   {"statusCode":301}  -> falla
          #   {"errorMessage":..} -> falla (sin statusCode)
          #   respuesta no-JSON   -> falla
          status="$(python3 -c "import json;print(json.load(open('/tmp/respuesta.json')).get('statusCode',''))" 2>/dev/null || echo "")"
          case "$status" in
            2*) ;;
            *)
              echo "::error::${HEALTH_PATH} devolvió ${status:-sin statusCode}, no un 2xx."
              echo "::error::Eso no prueba que la app arrancó: un error HTTP lo devuelve"
              echo "::error::igual una imagen rota. Si el path es otro, pasá health-path."
              exit 1
              ;;
          esac

          echo "✅ La función arranca y responde."

      - name: Fetch Discord webhook from SSM
        id: discord
        run: |
          WEBHOOK=$(aws ssm get-parameter \
            --name /korz/discord-webhook-url \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region us-east-1 2>/dev/null || echo "")
          echo "webhook=$WEBHOOK" >> $GITHUB_OUTPUT

      # `webhook`, NO `webhook_url`: con el nombre equivocado la action tira
      # un warning ("Unexpected input(s) 'webhook_url'") y sigue en verde sin
      # mandar nada. Así estuvo desde que se escribió: cero mensajes, cero
      # señales de que algo faltaba.
      - name: Notify Discord (staging)
        if: always() && steps.discord.outputs.webhook != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ steps.discord.outputs.webhook }}
          status: ${{ job.status }}
          nodetail: true
          username: korz deploys
          title: ${{ job.status == 'success' && format('✅ {0} → staging', inputs.ecr-repo) || format('❌ {0} → staging FALLÓ', inputs.ecr-repo) }}
          description: |
            **Lambda** `${{ vars.LAMBDA_FUNCTION_STAGING }}` · **imagen** `${{ inputs.ecr-repo }}:latest`
            **Commit** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) por **${{ github.actor }}**
            > ${{ github.event.head_commit.message && github.event.head_commit.message || inputs.trigger-branch }}
            [ver el run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ job.status == 'success' && 3066993 || 15158332 }}

  deploy-prod:
    if: inputs.build-conclusion == 'success' && inputs.prod-branch != '' && inputs.trigger-branch == inputs.prod-branch
    # Build/deploy corre en GitHub, NO en el self-hosted, aunque el CI sí lo use.
    #
    # KORZ_BUILD_RUNNER_LABELS existe sólo para partir eso en dos. El
    # self-hosted es la máquina de trabajo del dev, y estos jobs son los caros:
    # un `docker build` se come la RAM y deja atrás capas y cachés de buildx —
    # 31 GB de volúmenes huérfanos la última vez, con el disco al 99%.
    #
    # El CI (tests, lint, contract) es liviano y sigue donde diga
    # KORZ_RUNNER_LABELS. Sin la variable nueva, esto cae a ubuntu-latest, que
    # es el default correcto para un repo que no configuró nada.
    # KORZ_CODEBUILD_PROJECT tiene precedencia: el label de CodeBuild exige el
    # run_id interpolado (codebuild-<proyecto>-<run_id>-<run_attempt>) y GitHub
    # NO evalúa ${{ }} dentro de valores de variables, así que el formato se
    # arma acá con format(). Sin esa var, KORZ_BUILD_RUNNER_LABELS como
    # siempre, y sin ninguna, ubuntu-latest.
    runs-on: ${{ vars.KORZ_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}', vars.KORZ_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || fromJSON(vars.KORZ_BUILD_RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      id-token: write
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ inputs.aws-region-prod }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Lambda function (prod)
        env:
          LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION_PROD }}
        run: |
          if [ -z "$LAMBDA_FUNCTION" ]; then
            echo "⚠️  LAMBDA_FUNCTION_PROD not set"
            exit 1
          fi
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repo }}:latest"
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $IMAGE_URI \
            --region ${{ inputs.aws-region-prod }}
          echo "✅ Lambda updated: $IMAGE_URI"

      - name: Wait for Lambda to stabilize
        env:
          LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION_PROD }}
        run: |
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION \
            --region ${{ inputs.aws-region-prod }}
          echo "✅ Lambda ready"

      - name: Create release tag
        if: ${{ inputs.create-release-tag }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          TAG=$(git describe --tags --always | head -1)
          # Ver build-docker-ecr.yml: `|| true` mezclaba "el tag ya existe" con
          # "el push falló". En el camino de PROD, lo segundo en verde significa
          # creer que hay una release taggeada que no está.
          if git rev-parse -q --verify "refs/tags/${TAG}-prod" >/dev/null; then
            echo "el tag ${TAG}-prod ya existe — no se re-taggea"
          else
            git tag -a "${TAG}-prod" -m "Prod release: ${TAG}"
            git push origin "${TAG}-prod"
          fi

      - name: Fetch Discord webhook from SSM
        id: discord
        run: |
          WEBHOOK=$(aws ssm get-parameter \
            --name /korz/discord-webhook-url \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region us-east-1 2>/dev/null || echo "")
          echo "webhook=$WEBHOOK" >> $GITHUB_OUTPUT

      - name: Notify Discord (prod)
        if: always() && steps.discord.outputs.webhook != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ steps.discord.outputs.webhook }}
          status: ${{ job.status }}
          nodetail: true
          username: korz deploys
          title: ${{ job.status == 'success' && format('🚀 {0} → PRODUCCIÓN', inputs.ecr-repo) || format('🔥 {0} → PRODUCCIÓN FALLÓ', inputs.ecr-repo) }}
          description: |
            **Lambda** `${{ vars.LAMBDA_FUNCTION_PROD }}` · **imagen** `${{ inputs.ecr-repo }}:latest`
            **Commit** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) por **${{ github.actor }}**
            > ${{ github.event.head_commit.message && github.event.head_commit.message || inputs.trigger-branch }}
            [ver el run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ job.status == 'success' && 15844367 || 15158332 }}
