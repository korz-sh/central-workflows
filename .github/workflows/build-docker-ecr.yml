name: Build & Push to ECR (Reusable)

# AWS Lambda requires Docker v2 manifest, not OCI index — provenance: false is enforced.

on:
  workflow_call:
    inputs:
      ecr-repo:
        required: true
        type: string
        description: 'ECR repository name, e.g. web-api, identity-v2'
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile.lambda'
        description: 'Path to Dockerfile'
      aws-region:
        required: false
        type: string
        default: 'us-east-2'
      pass-github-token-build-arg:
        required: false
        type: boolean
        default: true
        description: 'Pass GITHUB_ACTOR and GITHUB_TOKEN as Docker build args'
    secrets:
      AWS_ROLE_ARN_STAGING:
        required: true
      GH_PAT:
        required: false
    outputs:
      image-uri:
        description: 'Full ECR image URI with version tag'
        value: ${{ jobs.build-and-push.outputs.image-uri }}
      image-tag:
        description: 'Version tag (e.g. v20260531.123456)'
        value: ${{ jobs.build-and-push.outputs.image-tag }}

jobs:
  # Only on `push`. A PR CANNOT run this, and must not.
  #
  # This job assumes an AWS role via OIDC, and the trust policy allows
  # `repo:korz-sh/*:ref:refs/heads/*` — branch pushes only, so a PR from a fork
  # or an untrusted branch cannot mint credentials. That restriction is correct
  # and deliberate.
  #
  # But a `pull_request` run has a different `sub` claim, so it is REJECTED with
  # "Not authorized to perform sts:AssumeRoleWithWebIdentity". Every PR in every
  # repo calling this workflow therefore showed a red check that could never be
  # green — for a reason that has nothing to do with the code under review.
  #
  # That is worse than useless. agent-platform-api already hit this (KOR-67):
  # the permanent red trained everyone to merge with --admin, which then masked
  # a real failure (KOR-60 F5). A check that always fails teaches people to
  # ignore checks.
  #
  # So: PRs run their repo's test/lint gate, and the image ships on merge. Safe
  # to skip on PRs because no caller consumes this job's outputs from a PR run —
  # verified across all six callers (entitlement-api, identity-api-v2,
  # korz-query-api, payments-service-api, rbac-api, web-api): none chain a
  # `needs:` on it.
  build-and-push:
    # Skip on PRs (no caller chains a `needs:` on this job from a PR run), but
    # NOT on workflow_dispatch. The gate used to be `== 'push'` alone, which
    # made every caller's "Run workflow" button accept the click and then skip
    # the only job -- a button that lies.
    #
    # That is not a cosmetic bug: build.yml also filters on `paths: src/**`, so
    # a change to a Dockerfile, a workflow or config produces no image, and with
    # the dispatch button dead the ONLY way to ship one is to touch a file under
    # src/. Hence 48 `chore: trigger build` commits across 7 repos in 6 months,
    # two of them mine today. The workaround was that common because the button
    # never worked.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: write
      id-token: write
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      image-tag: ${{ steps.meta.outputs.image-tag }}

    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y%m%d.%H%M%S')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"

      # One step, not two. This used to be the same 15 lines duplicated under
      # opposite `if:` guards, differing only in whether `build-args` was
      # present -- so any fix to the tags, the cache scope or the provenance
      # flag had to be made twice, and once was made in only one of them.
      #
      # An empty `build-args` is equivalent to omitting it, so the conditional
      # collapses into the value instead of the step.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: false
          # The conditional is on the VALUE, not on the step. A build arg a
          # Dockerfile does not declare is a buildx warning, never an error, so
          # passing an empty token to the images that do not need one is safe --
          # and the callers that set this flag false are exactly the ones whose
          # Dockerfile never reads it.
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ inputs.pass-github-token-build-arg && (secrets.GH_PAT || secrets.GITHUB_TOKEN) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.ecr-repo }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ inputs.ecr-repo }}:latest
          # KOR-53 Q1: layer cache, scoped per ecr-repo so a caller that builds more
          # than one image (e.g. korz-query build + build-deployer) doesn't clobber its
          # own cache. type=gha is fine here — every consumer of this reusable ships a
          # small .NET/Python image (NOT the heavy mcp images, which stay on registry
          # cache to avoid the 10GB gha limit).
          cache-from: type=gha,scope=${{ inputs.ecr-repo }}
          cache-to: type=gha,mode=max,scope=${{ inputs.ecr-repo }}

      - name: Set image URI metadata
        id: meta
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ inputs.ecr-repo }}:${{ steps.version.outputs.version }}"
          echo "image-uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "image-tag=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "🐳 Image URI: ${IMAGE_URI}"

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}" || true
          git push origin "${{ steps.version.outputs.version }}" || true
