name: Build & Push to ECR (Reusable)

# AWS Lambda requires Docker v2 manifest, not OCI index — provenance: false is enforced.

on:
  workflow_call:
    inputs:
      ecr-repo:
        required: true
        type: string
        description: 'ECR repository name, e.g. web-api, identity-v2'
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile.lambda'
        description: 'Path to Dockerfile'
      aws-region:
        required: false
        type: string
        default: 'us-east-2'
      pass-github-token-build-arg:
        required: false
        type: boolean
        default: true
        description: 'Pass GITHUB_ACTOR and GITHUB_TOKEN as Docker build args'
      codeartifact-domain:
        required: false
        type: string
        default: ''
        description: >-
          CodeArtifact domain to mint a pip token for, e.g. `korz`. Empty (the
          default) mints nothing and changes nothing. Set it when the image
          installs a package published to CodeArtifact rather than public PyPI
          (tessera-db is the first) — the token is minted with the AWS role this
          job already assumed and expires in 12 hours. It is passed as a
          BUILDKIT SECRET (id `codeartifact_token`), never as a build arg:
          Docker records the args a RUN consumed in the image metadata, so a
          build arg is readable with `docker history --no-trunc`. Measured, not
          assumed. The Dockerfile consumes it with
          `RUN --mount=type=secret,id=codeartifact_token`.
      codeartifact-region:
        required: false
        type: string
        default: 'us-east-2'
        description: 'Region of the CodeArtifact domain. Ignored when codeartifact-domain is empty.'
    secrets:
      AWS_ROLE_ARN_STAGING:
        required: true
      GH_PAT:
        required: false
    outputs:
      image-uri:
        description: 'Full ECR image URI with version tag'
        value: ${{ jobs.build-and-push.outputs.image-uri }}
      image-tag:
        description: 'Version tag (e.g. v20260531.123456)'
        value: ${{ jobs.build-and-push.outputs.image-tag }}

jobs:
  # Only on `push`. A PR CANNOT run this, and must not.
  #
  # This job assumes an AWS role via OIDC, and the trust policy allows
  # `repo:korz-sh/*:ref:refs/heads/*` — branch pushes only, so a PR from a fork
  # or an untrusted branch cannot mint credentials. That restriction is correct
  # and deliberate.
  #
  # But a `pull_request` run has a different `sub` claim, so it is REJECTED with
  # "Not authorized to perform sts:AssumeRoleWithWebIdentity". Every PR in every
  # repo calling this workflow therefore showed a red check that could never be
  # green — for a reason that has nothing to do with the code under review.
  #
  # That is worse than useless. agent-platform-api already hit this (KOR-67):
  # the permanent red trained everyone to merge with --admin, which then masked
  # a real failure (KOR-60 F5). A check that always fails teaches people to
  # ignore checks.
  #
  # So: PRs run their repo's test/lint gate, and the image ships on merge. Safe
  # to skip on PRs because no caller consumes this job's outputs from a PR run —
  # verified across all six callers (entitlement-api, identity-api-v2,
  # korz-query-api, payments-service-api, rbac-api, web-api): none chain a
  # `needs:` on it.
  build-and-push:
    # Skip on PRs (no caller chains a `needs:` on this job from a PR run), but
    # NOT on workflow_dispatch. The gate used to be `== 'push'` alone, which
    # made every caller's "Run workflow" button accept the click and then skip
    # the only job -- a button that lies.
    #
    # That is not a cosmetic bug: build.yml also filters on `paths: src/**`, so
    # a change to a Dockerfile, a workflow or config produces no image, and with
    # the dispatch button dead the ONLY way to ship one is to touch a file under
    # src/. Hence 48 `chore: trigger build` commits across 7 repos in 6 months,
    # two of them mine today. The workaround was that common because the button
    # never worked.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Build/deploy corre en GitHub, NO en el self-hosted, aunque el CI sí lo use.
    #
    # KORZ_BUILD_RUNNER_LABELS existe sólo para partir eso en dos. El
    # self-hosted es la máquina de trabajo del dev, y estos jobs son los caros:
    # un `docker build` se come la RAM y deja atrás capas y cachés de buildx —
    # 31 GB de volúmenes huérfanos la última vez, con el disco al 99%.
    #
    # El CI (tests, lint, contract) es liviano y sigue donde diga
    # KORZ_RUNNER_LABELS. Sin la variable nueva, esto cae a ubuntu-latest, que
    # es el default correcto para un repo que no configuró nada.
    # KORZ_CODEBUILD_PROJECT tiene precedencia: el label de CodeBuild exige el
    # run_id interpolado (codebuild-<proyecto>-<run_id>-<run_attempt>) y GitHub
    # NO evalúa ${{ }} dentro de valores de variables, así que el formato se
    # arma acá con format(). Sin esa var, KORZ_BUILD_RUNNER_LABELS como
    # siempre, y sin ninguna, ubuntu-latest.
    runs-on: ${{ vars.KORZ_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}', vars.KORZ_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || fromJSON(vars.KORZ_BUILD_RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: write
      id-token: write
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      image-tag: ${{ steps.meta.outputs.image-tag }}

    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      # Minted only when a caller asks for it, so the six existing callers are
      # untouched: no extra AWS call, no extra permission, no new failure mode.
      #
      # `aws codeartifact get-authorization-token` needs sts:GetServiceBearerToken
      # on the assumed role. If the role lacks it this step FAILS the build,
      # which is the correct outcome: the alternative is an image that builds
      # green and dies on its first `import`.
      - name: Mint CodeArtifact token
        if: inputs.codeartifact-domain != ''
        run: |
          set -euo pipefail
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${{ inputs.codeartifact-domain }}" \
            --region "${{ inputs.codeartifact-region }}" \
            --query authorizationToken --output text)
          # An empty token here is the failure mode this guard exists for.
          # `--query authToken` (the field is authorizationToken) returns the
          # literal string "None", and pip then 401s on a URL that looks
          # perfectly well-formed. Caught on the first real run; the wrong name
          # came from tessera-db's own PUBLISHING.md.
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::CodeArtifact returned no token. Check the role has"
            echo "::error::codeartifact:GetAuthorizationToken and sts:GetServiceBearerToken."
            exit 1
          fi
          # Masked before it is exported: without this the token appears in
          # plain text in any `set -x` or buildx error further down. Masking
          # protects the LOG; the BuildKit secret protects the image.
          echo "::add-mask::$TOKEN"
          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y%m%d.%H%M%S')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"

      # One step, not two. This used to be the same 15 lines duplicated under
      # opposite `if:` guards, differing only in whether `build-args` was
      # present -- so any fix to the tags, the cache scope or the provenance
      # flag had to be made twice, and once was made in only one of them.
      #
      # An empty `build-args` is equivalent to omitting it, so the conditional
      # collapses into the value instead of the step.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: false
          # The conditional is on the VALUE, not on the step. A build arg a
          # Dockerfile does not declare is a buildx warning, never an error, so
          # passing an empty token to the images that do not need one is safe --
          # and the callers that set this flag false are exactly the ones whose
          # Dockerfile never reads it.
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ inputs.pass-github-token-build-arg && (secrets.GH_PAT || secrets.GITHUB_TOKEN) || '' }}
          # A SECRET, not a build arg. See the input description: build args a
          # RUN consumed are printed back by `docker history --no-trunc`.
          # Empty when no domain was requested, which is the same as absent.
          secrets: |
            codeartifact_token=${{ env.CODEARTIFACT_AUTH_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.ecr-repo }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ inputs.ecr-repo }}:latest
          # KOR-53 Q1: layer cache, scoped per ecr-repo so a caller that builds more
          # than one image (e.g. korz-query build + build-deployer) doesn't clobber its
          # own cache. type=gha is fine here — every consumer of this reusable ships a
          # small .NET/Python image (NOT the heavy mcp images, which stay on registry
          # cache to avoid the 10GB gha limit).
          cache-from: type=gha,scope=${{ inputs.ecr-repo }}
          cache-to: type=gha,mode=max,scope=${{ inputs.ecr-repo }}

      - name: Set image URI metadata
        id: meta
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ inputs.ecr-repo }}:${{ steps.version.outputs.version }}"
          echo "image-uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "image-tag=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "🐳 Image URI: ${IMAGE_URI}"

      # El tag se crea por la API de refs y no con `git push`, y no es
      # cuestión de gusto: `git push` inspecciona el arbol que se empuja, y
      # si el commit toca `.github/workflows/**` lo rechaza con
      #
      #   refusing to allow a GitHub App to create or update workflow
      #   `.github/workflows/x.yml` without `workflows` permission
      #
      # aunque lo unico que se este empujando sea un tag que ya apunta a un
      # commit que ya esta en el remoto. O sea: cualquier commit que toque un
      # workflow rompe su propio build, en el paso de despues de haber
      # construido y publicado la imagen. Medido en zonda-api.
      #
      # `permissions: workflows: write` no es la salida: no existe como
      # permiso de job, y el token del workflow no puede otorgarselo. La API
      # de refs no hace esa validacion — probado creando el tag por API sobre
      # el mismo commit que `git push` habia rechazado.
      - name: Create git tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          # Distinguir "ya existe" de "fallo" sigue siendo el punto: un re-run
          # del mismo commit es esperable, un fallo de permisos o de red no, y
          # tragarse el segundo deja el job en verde diciendo que taggeo una
          # release que no existe.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "el tag ${TAG} ya existe — no se re-taggea"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}"
