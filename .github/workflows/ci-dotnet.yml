name: CI .NET (Reusable)

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      service-name:
        required: true
        type: string
        description: 'Service name for korz-status reporting (e.g. rbac-api)'
      coverage-json-path:
        required: false
        type: string
        # reportgenerator's JsonSummary reporter writes Summary.json, not
        # coverage.json. The old default pointed at a file that is never
        # created, and the reader below silently substituted 0 -- so every
        # consumer published "0% coverage" while actually sitting at 44.5%.
        default: 'coverage/Summary.json'
        description: 'Path to reportgenerator JsonSummary output'
    secrets:
      # Declared so callers can pass THIS ONE secret instead of `secrets:
      # inherit` (KOR-251). `inherit` hands the reusable every secret the
      # calling repo holds — AWS role ARNs, tokens, everything — to run a job
      # that needs exactly one, and it does it across a `@main` reference,
      # which is a moving target.
      #
      # Optional, because the workflow already falls back to the automatic
      # GITHUB_TOKEN. That fallback is why the restore only fails on repos
      # that actually consume the private NuGet feed.
      GH_PAT:
        required: false
        description: 'Reads the private NuGet feed; falls back to GITHUB_TOKEN'

jobs:
  # KOR-54: the `validate` job (restore + build) was dropped. It duplicated the compile
  # that `test` already does — a whole second runner + full restore + build for no
  # artifact `test` didn't already produce. Confirmed safe: none of the 3 consumers
  # (web-api, rbac-api, entitlement-api) pin `validate` as a required status check in
  # branch protection (all have zero required checks), so removing it breaks no merge.
  test:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    # Nothing in this org had a timeout. A hung job holds a self-hosted runner
    # until the 6h default, and the pool is shared across 13 repos.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          # NO `cache: true` here, deliberately, and it is not an oversight.
          #
          # It was added (KOR-53) and it broke the build. setup-dotnet's cache
          # restores the NuGet folder with `tar -P` -- absolute paths -- into
          # the workspace:
          #
          #   Cache Size: ~691 MB
          #   tar -xf cache.tzst -P -C .../_work/entitlement-api/entitlement-api
          #   Cache restored successfully
          #   Run dotnet restore
          #   MSBUILD : error MSB1003: Specify a project or solution file.
          #
          # The checkout was gone by the time restore ran. entitlement-api does
          # have entitlement-api.sln at its root, and this job was green on main
          # the day before, so the cache restore is what removed it.
          #
          # The deeper reason not to reach for it again: every consumer of this
          # workflow runs on a PERSISTENT self-hosted runner (KOR-320), where
          # ~/.nuget/packages already survives between jobs. actions/cache is
          # solving a problem that only exists on ephemeral hosted runners, and
          # charging a 691 MB untar over the working directory for it.
      # GitHub Packages requires auth even to READ, and Korz.Shared.Contracts
      # lives there. Without this, `dotnet restore` fails with NU1101 ("no
      # packages exist with this id") for any consumer that does not vendor a
      # .nupkg into the repo -- which is why entitlement-api's CI had 0
      # successes in its last 30 runs.
      #
      # Guarded on the file existing, so repos that vendor their packages
      # (web-api, rbac-api) are untouched. GITHUB_TOKEN is read-only for
      # packages, which is exactly the access needed here.
      - name: Authenticate to GitHub Packages, if this repo uses it
        env:
          # GH_PAT first: the automatic GITHUB_TOKEN is scoped to the RUNNING
          # repo, and the package lives in shared-contracts, so cross-repo reads
          # need a PAT. GITHUB_TOKEN is kept as a fallback because it does work
          # when the package and the workflow share a repo, and because failing
          # to authenticate is better diagnosed by the restore below than by a
          # missing-secret error here.
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -q "nuget.pkg.github.com" nuget.config 2>/dev/null; then
            echo "no GitHub Packages source in nuget.config, nothing to do"
            exit 0
          fi
          dotnet nuget update source github \
            --username x-access-token \
            --password "$TOKEN" \
            --store-password-in-clear-text
          echo "authenticated to GitHub Packages"

      - run: dotnet restore

      # Absorbed from dotnet-pr-check.yml, which is deleted in this change. That
      # workflow was a second job doing its own checkout, its own setup-dotnet
      # and its own full restore, to run a check that takes seconds -- and its
      # `test` job re-ran the very tests this job already runs, so every PR paid
      # for the .NET test suite twice.
      #
      # KOR-155: `|| echo "Format issues found"` made this decorative. Expect it
      # to go red the first time somebody looks -- that is the information, not
      # an obstacle. If formatting is not going to be enforced, delete the step;
      # if it is, fix the formatting. A check that reports its own failure as
      # success is the one option that helps nobody.
      - run: dotnet format --verify-no-changes

      # --no-restore: reuse the restore above instead of restoring implicitly again.
      - run: dotnet test --no-restore --collect:"XPlat Code Coverage" --logger "trx" --results-directory TestResults
      # `dotnet tool install -g` FAILS when the tool is already installed
      # ("La herramienta ... ya está instalada", exit 1), which aborts the step
      # before reportgenerator ever runs. On a fresh ubuntu-latest image that
      # never happens, so the bug was invisible; on any reused machine — a
      # self-hosted runner, a warm container — the second run onwards fails.
      #
      # It fails AFTER the tests have passed, so the job reports red with a
      # green test summary above it: it reads like a flaky test suite and is
      # actually a missing idempotency check.
      #
      # `update` installs when absent and upgrades when present, which is what
      # this step meant all along.
      # `update` was supposed to be the idempotent form of `install`, and it is
      # not: on a reused runner where the tool is already current it prints
      # "ya está instalada" and exits 1. Observed in CI (exit 1) but NOT locally
      # (exit 0), so the behaviour depends on how the tool was installed, which
      # makes it exactly the kind of thing not to encode an assumption about.
      #
      # It failed AFTER the tests passed, so the job went red under a green
      # "95/95" summary: it reads like a flaky suite and is a missing
      # idempotency check.
      #
      # continue-on-error rather than `|| true`, deliberately: the real exit
      # code survives and the step shows as failed if something genuinely broke,
      # instead of being rewritten to 0 and telling the reader nothing. The
      # assertion that matters is the reportgenerator step below, which is a
      # separate step whose exit code IS honoured.
      - name: Install the coverage tool, if missing
        continue-on-error: true
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Coverage report
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:"Cobertura;JsonSummary;Html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-dotnet-${{ inputs.service-name }}
          path: |
            TestResults/
            coverage/
          retention-days: 1

  coverage:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    needs: test
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-dotnet-${{ inputs.service-name }}

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Two bugs lived here, and both reported a plausible number instead of
          # an error:
          #
          #   1. the path defaulted to coverage/coverage.json, which
          #      reportgenerator never writes (it writes Summary.json)
          #   2. the jq path was .total.lines.pct, which does not exist in that
          #      file either -- the field is .summary.linecoverage
          #
          # Either one alone produced "0" via the else branch, so the badge said
          # 0% for a service at 44.5% and nobody could tell the difference
          # between "no coverage" and "no file".
          #
          # Now a missing file is an explicit, visible 'unknown' rather than a
          # number that looks measured.
          FILE="${{ inputs.coverage-json-path }}"
          if [ ! -f "$FILE" ]; then
            echo "::warning::coverage summary not found at $FILE — reporting unknown, not 0"
            echo "percentage=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi

          COVERAGE=$(jq -r '.summary.linecoverage // empty' "$FILE")
          if [ -z "$COVERAGE" ]; then
            echo "::warning::$FILE has no .summary.linecoverage — reporting unknown"
            COVERAGE="unknown"
          fi
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Publish coverage to korz-status
        # `master` instead of `develop`: rbac-api's default branch is master, so
        # its coverage was never published, while develop -- which no consumer
        # of this workflow still uses -- was.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/korz-sh/korz-status.git korz-status --depth=1
          cd korz-status

          SERVICE="${{ inputs.service-name }}"
          COVERAGE="${{ steps.coverage.outputs.percentage }}"

          mkdir -p reports .badges

          cat > reports/${SERVICE}-coverage.json <<EOF
          {
            "service": "${SERVICE}",
            "coverage": ${COVERAGE},
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source_run_id": "${{ github.run_id }}"
          }
          EOF

          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then COLOR="4c1"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then COLOR="dfb317"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then COLOR="fe7d37"
          else COLOR="e05d44"; fi

          cat > .badges/${SERVICE}-coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="150" height="20">
            <rect width="100" height="20" fill="#555"/>
            <rect x="100" width="50" height="20" fill="#${COLOR}"/>
            <text x="50" y="14" fill="#fff" text-anchor="middle" font-family="Verdana" font-size="11">${SERVICE}</text>
            <text x="125" y="14" fill="#fff" text-anchor="middle" font-family="Verdana" font-size="11">${COVERAGE}%</text>
          </svg>
          EOF

          git config user.name "Korz Bot"
          git config user.email "bot@korz.sh"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/korz-sh/korz-status.git
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage for ${SERVICE} - ${COVERAGE}%"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
