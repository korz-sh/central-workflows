name: CI .NET (Reusable)

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      service-name:
        required: true
        type: string
        description: 'Service name for korz-status reporting (e.g. rbac-api)'
      coverage-json-path:
        required: false
        type: string
        default: 'coverage/coverage.json'
        description: 'Path to reportgenerator Json output'

jobs:
  # KOR-54: the `validate` job (restore + build) was dropped. It duplicated the compile
  # that `test` already does — a whole second runner + full restore + build for no
  # artifact `test` didn't already produce. Confirmed safe: none of the 3 consumers
  # (web-api, rbac-api, entitlement-api) pin `validate` as a required status check in
  # branch protection (all have zero required checks), so removing it breaks no merge.
  test:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      # GitHub Packages requires auth even to READ, and Korz.Shared.Contracts
      # lives there. Without this, `dotnet restore` fails with NU1101 ("no
      # packages exist with this id") for any consumer that does not vendor a
      # .nupkg into the repo -- which is why entitlement-api's CI had 0
      # successes in its last 30 runs.
      #
      # Guarded on the file existing, so repos that vendor their packages
      # (web-api, rbac-api) are untouched. GITHUB_TOKEN is read-only for
      # packages, which is exactly the access needed here.
      - name: Authenticate to GitHub Packages, if this repo uses it
        env:
          # GH_PAT first: the automatic GITHUB_TOKEN is scoped to the RUNNING
          # repo, and the package lives in shared-contracts, so cross-repo reads
          # need a PAT. GITHUB_TOKEN is kept as a fallback because it does work
          # when the package and the workflow share a repo, and because failing
          # to authenticate is better diagnosed by the restore below than by a
          # missing-secret error here.
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -q "nuget.pkg.github.com" nuget.config 2>/dev/null; then
            echo "no GitHub Packages source in nuget.config, nothing to do"
            exit 0
          fi
          dotnet nuget update source github \
            --username x-access-token \
            --password "$TOKEN" \
            --store-password-in-clear-text
          echo "authenticated to GitHub Packages"

      - run: dotnet restore
      # --no-restore: reuse the restore above instead of restoring implicitly again.
      - run: dotnet test --no-restore --collect:"XPlat Code Coverage" --logger "trx" --results-directory TestResults
      # `dotnet tool install -g` FAILS when the tool is already installed
      # ("La herramienta ... ya está instalada", exit 1), which aborts the step
      # before reportgenerator ever runs. On a fresh ubuntu-latest image that
      # never happens, so the bug was invisible; on any reused machine — a
      # self-hosted runner, a warm container — the second run onwards fails.
      #
      # It fails AFTER the tests have passed, so the job reports red with a
      # green test summary above it: it reads like a flaky test suite and is
      # actually a missing idempotency check.
      #
      # `update` installs when absent and upgrades when present, which is what
      # this step meant all along.
      - run: |
          dotnet tool update -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:"Cobertura;JsonSummary;Html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-dotnet-${{ inputs.service-name }}
          path: |
            TestResults/
            coverage/
          retention-days: 1

  coverage:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-dotnet-${{ inputs.service-name }}

      - name: Extract coverage percentage
        id: coverage
        run: |
          if [ -f "${{ inputs.coverage-json-path }}" ]; then
            COVERAGE=$(jq '.total.lines.pct' "${{ inputs.coverage-json-path }}")
          else
            COVERAGE="0"
          fi
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Publish coverage to korz-status
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        continue-on-error: true
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/korz-sh/korz-status.git korz-status --depth=1
          cd korz-status

          SERVICE="${{ inputs.service-name }}"
          COVERAGE="${{ steps.coverage.outputs.percentage }}"

          mkdir -p reports .badges

          cat > reports/${SERVICE}-coverage.json <<EOF
          {
            "service": "${SERVICE}",
            "coverage": ${COVERAGE},
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source_run_id": "${{ github.run_id }}"
          }
          EOF

          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then COLOR="4c1"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then COLOR="dfb317"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then COLOR="fe7d37"
          else COLOR="e05d44"; fi

          cat > .badges/${SERVICE}-coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="150" height="20">
            <rect width="100" height="20" fill="#555"/>
            <rect x="100" width="50" height="20" fill="#${COLOR}"/>
            <text x="50" y="14" fill="#fff" text-anchor="middle" font-family="Verdana" font-size="11">${SERVICE}</text>
            <text x="125" y="14" fill="#fff" text-anchor="middle" font-family="Verdana" font-size="11">${COVERAGE}%</text>
          </svg>
          EOF

          git config user.name "Korz Bot"
          git config user.email "bot@korz.sh"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/korz-sh/korz-status.git
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage for ${SERVICE} - ${COVERAGE}%"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
