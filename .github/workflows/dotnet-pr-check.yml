name: PR Check .NET (Reusable)

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0'

jobs:
  test:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      # Authenticate BEFORE restore, or a private package is a 401.
      #
      # ci-dotnet.yml has had this step since KOR-159; this workflow never did,
      # so `dotnet restore` here could not read Korz.Shared.Contracts from
      # GitHub Packages at all:
      #
      #   error NU1301: Failed to retrieve information about
      #   'Korz.Shared.Contracts' ... 401 (Unauthorized).
      #
      # It went unnoticed because these jobs had not actually run for weeks --
      # first the branch-trigger bug (KOR-157), then an org runner-label
      # variable pointing every job at a self-hosted runner that did not exist.
      # Two layers of "never ran" hiding a third thing that could not work.
      #
      # Guarded on nuget.config mentioning the feed, so repos that vendor their
      # packages are untouched.
      - name: Authenticate to GitHub Packages, if this repo uses it
        env:
          # GH_PAT first: the automatic GITHUB_TOKEN is scoped to the RUNNING
          # repo, and the package lives in shared-contracts, so a cross-repo
          # read needs a PAT. GITHUB_TOKEN stays as a fallback for the
          # same-repo case.
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -q "nuget.pkg.github.com" nuget.config 2>/dev/null; then
            echo "no GitHub Packages source in nuget.config, nothing to do"
            exit 0
          fi
          dotnet nuget update source github \
            --username x-access-token \
            --password "$TOKEN" \
            --store-password-in-clear-text
          echo "authenticated to GitHub Packages"

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # KOR-155: this used to end in `|| echo "No tests found"`, which replaced the
      # exit code with 0 — the job was green whether the tests passed, failed, or
      # did not exist. rbac-api had 15 failing tests behind that tick for months
      # (KOR-158), including the SNS event contract.
      #
      # A repo genuinely without tests should say so deliberately, not have the
      # failure swallowed in a way that looks identical to success.
      - run: dotnet test --configuration Release --no-build --verbosity normal

  lint:
    runs-on: ${{ fromJSON(vars.KORZ_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      # Authenticate BEFORE restore, or a private package is a 401.
      #
      # ci-dotnet.yml has had this step since KOR-159; this workflow never did,
      # so `dotnet restore` here could not read Korz.Shared.Contracts from
      # GitHub Packages at all:
      #
      #   error NU1301: Failed to retrieve information about
      #   'Korz.Shared.Contracts' ... 401 (Unauthorized).
      #
      # It went unnoticed because these jobs had not actually run for weeks --
      # first the branch-trigger bug (KOR-157), then an org runner-label
      # variable pointing every job at a self-hosted runner that did not exist.
      # Two layers of "never ran" hiding a third thing that could not work.
      #
      # Guarded on nuget.config mentioning the feed, so repos that vendor their
      # packages are untouched.
      - name: Authenticate to GitHub Packages, if this repo uses it
        env:
          # GH_PAT first: the automatic GITHUB_TOKEN is scoped to the RUNNING
          # repo, and the package lives in shared-contracts, so a cross-repo
          # read needs a PAT. GITHUB_TOKEN stays as a fallback for the
          # same-repo case.
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -q "nuget.pkg.github.com" nuget.config 2>/dev/null; then
            echo "no GitHub Packages source in nuget.config, nothing to do"
            exit 0
          fi
          dotnet nuget update source github \
            --username x-access-token \
            --password "$TOKEN" \
            --store-password-in-clear-text
          echo "authenticated to GitHub Packages"

      - run: dotnet restore
      # KOR-155: `|| echo "Format issues found"` made this decorative. Expect it to
      # go red the first time somebody looks — that is the information, not an
      # obstacle. If formatting is not going to be enforced, delete the step; if it
      # is, fix the formatting. A check that reports its own failure as success is
      # the one option that helps nobody.
      - run: dotnet format --verify-no-changes
