name: Publish to GHCR (Reusable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: 'Image name, e.g. web-api, entitlement-api'
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
        description: >-
          Ruta al Dockerfile. El default asume un `Dockerfile` pelado en la raíz,
          que es lo que tenían los repos de Node. Los que se portaron a Python
          despachan una imagen de Lambda y ya no tienen ese archivo: sin este
          input, el build muere con "failed to read dockerfile".

          OJO: este default (`Dockerfile`) NO es el mismo que el de
          build-docker-ecr.yml (`Dockerfile.lambda`). Los dos son correctos para
          su historia —GHCR nació sirviendo repos de Node, ECR nació sirviendo
          Lambdas— pero un repo que use los dos y declare el input en uno solo
          termina construyendo archivos distintos en cada pipeline. Hoy no pasa
          (verificado 2026-09-02: payments declara el input en los dos, identity
          usa el default en ambos y tiene los dos archivos), y este comentario
          existe para que el próximo lo mire antes de suponer.
      build-args:
        required: false
        type: string
        default: ''
        description: 'Newline-separated Docker build args (e.g. NPM_TOKEN=xxx)'
    secrets:
      NPM_TOKEN:
        required: false
      NPM_USERNAME:
        required: false
    outputs:
      image-tag:
        description: 'Published image tag (e.g. v20260531.1234)'
        value: ${{ jobs.publish.outputs.image-tag }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Push to GHCR
    # CodeBuild, igual que build-docker-ecr.yml, y por el mismo motivo: este job
    # CONSTRUYE UNA IMAGEN, y eso no se puede hacer en los runners de Fargate.
    #
    # El seccomp de Fargate bloquea `clone(CLONE_NEWUSER)`, así que ningún engine
    # rootless arranca ahí. El síntoma es este, y se venía repitiendo en cada
    # push a main de payments-service-api e identity-api-v2:
    #
    #     Error: cannot re-exec process
    #
    # Un arreglo anterior movió este job de `ubuntu-latest` a los runners de la
    # org (KOR-320), lo cual resolvió "el job no arranca" pero dejó "el job
    # arranca y no puede buildear". Los jobs que compilan van a CodeBuild; los
    # que sólo corren tests se quedan en Fargate.
    #
    # Consecuencia real mientras estuvo roto: `Publish` en rojo hace que el gate
    # de deploy no despache. Un arreglo del webhook de facturación se mergeó a
    # main y NO llegó a staging por esto.
    runs-on: ${{ vars.KORZ_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}', vars.KORZ_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || fromJSON(vars.KORZ_BUILD_RUNNER_LABELS || '"ubuntu-latest"') }}
    outputs:
      image-tag: ${{ steps.version.outputs.tag }}

    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "tag=$(date -u +'%Y%m%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/korz-sh/${{ inputs.image-name }}:latest
            ghcr.io/korz-sh/${{ inputs.image-name }}:v${{ steps.version.outputs.tag }}
          build-args: ${{ inputs.build-args }}
