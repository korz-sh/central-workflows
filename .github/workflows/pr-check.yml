# The gate for the repo that gates everything else.
#
# central-workflows had NO workflow of its own. Every file here is
# `workflow_call` only, so nothing ran on a PR and nothing ran on a push: a
# malformed YAML, a swallowed exit code, or a typo'd action ref could be merged
# with a green (empty) status and would then break the CI of all six consuming
# repos at once -- web-api, rbac-api, identity-api-v2, entitlement-api,
# korz-query-api, payments-service-api.
#
# All of them call these workflows at @main, so main IS the release channel.
# There is no staging step between a merge here and everyone else's CI.
name: PR Check

on:
  pull_request:
    branches: ['**']   # stacked PRs included (KOR-159)
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # Stays pinned to ubuntu-latest while everything else in the org moved to
    # `vars.KORZ_RUNNER_LABELS` (KOR-320), deliberately.
    #
    # This job is the required status check on this repo's main, and this repo is
    # the release channel for six others. Both runner strategies have a failure
    # mode: pinned dies when the hosted quota is exhausted, switched QUEUES
    # FOREVER when the variable names self-hosted labels with no runner
    # registered -- which is the state the org is in right now, and which is
    # indistinguishable from "about to start" (see korz-dev
    # docs/ci-queued-for-hours.md). The observation in that runbook is that the
    # hardcoded workflows were the ones that kept working.
    #
    # For the gate that has to be able to report in order for anything to merge,
    # failing loudly beats waiting silently.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 1. Every workflow must parse. A YAML error here is invisible until it
      #    reaches a consumer, because a reusable workflow is never run in place.
      - name: Every workflow is valid YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  d = yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e).splitlines()[0]))
                  continue
              if not isinstance(d, dict) or "jobs" not in d:
                  bad.append((f, "no jobs block"))
                  continue
              print(f"  ok  {f}  jobs={list(d['jobs'])}")

          # Composite actions are part of the blast radius now: the org's
          # security gate calls .github/actions/{semgrep,supply-chain}-scan from
          # all 13 repos, so a broken action.yml here breaks every one of them at
          # once -- and the workflow glob above would never look at it.
          for f in sorted(glob.glob(".github/actions/*/action.yml")):
              try:
                  d = yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e).splitlines()[0]))
                  continue
              if not isinstance(d, dict) or "runs" not in d:
                  bad.append((f, "no runs block"))
                  continue
              steps = (d.get("runs") or {}).get("steps") or []
              # `shell:` is required on every composite `run` step. Omitting it is
              # accepted by the YAML parser and rejected at runtime, in every
              # caller simultaneously.
              for i, st in enumerate(steps, 1):
                  if "run" in st and not st.get("shell"):
                      bad.append((f, f"step {i} has `run` with no `shell`"))
              print(f"  ok  {f}  inputs={list(d.get('inputs') or {})}")

          if bad:
              print("\nINVALID:")
              for f, e in bad:
                  print(f"  {f}: {e}")
              sys.exit(1)
          PY

      # 2. No check may swallow its exit code. This is the defect that started
      #    the audit: `dotnet test ... || echo "No tests found"` reported a
      #    green tick for a suite that never ran, and every repo calling it
      #    inherited that lie.
      #
      #    Use `continue-on-error: true` for a genuinely optional step. It keeps
      #    the real exit code and shows the step as failed without failing the
      #    job, so the reader can still tell what happened.
      - name: No check swallows its exit code
        run: |
          # A command substitution supplying a default -- VAR=$(... || echo "")
          # -- asserts nothing and is excluded; everything else is a gate.
          hits=$(grep -rn -E '^\s*(-\s*)?run:.*\|\|\s*echo' .github/workflows/ \
                 | grep -vE '^[^:]+:[0-9]+:\s*[A-Za-z_][A-Za-z0-9_]*=\$\(' || true)
          if [ -n "$hits" ]; then
            echo "These steps can never fail:"
            echo "$hits"
            echo
            echo "Use 'continue-on-error: true' if the step is genuinely optional."
            exit 1
          fi
          echo "no swallowed exit codes"

      # 3. A reusable WORKFLOW can only be called from a job, never from a
      #    step. ci-go.yml and ci-node.yml both had `uses: .../publish-status.yml`
      #    inside a step, which makes the entire file invalid: the run died at
      #    startup with 0 jobs in 0 seconds, on EVERY push, 0 successes in 40
      #    runs -- and nobody saw it, because nothing consumes these on push and
      #    the repo had no gate of its own.
      - name: No step calls a reusable workflow
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(f)) or {}
              for jn, j in (d.get("jobs") or {}).items():
                  for st in (j.get("steps") or []):
                      u = st.get("uses", "")
                      if "/.github/workflows/" in u:
                          bad.append(f"{f}: job '{jn}' step '{st.get('name')}' uses {u}")
          for b in bad:
              print("  " + b)
          if bad:
              print("\nA reusable workflow is called from a JOB (`jobs.x.uses`), not a step.")
              sys.exit(1)
          print("no step calls a reusable workflow")
          PY

      # 4. `GITHUB_TOKEN` is a RESERVED secret name. GitHub injects it, so a
      #    workflow_call that DECLARES it is rejected before any job starts --
      #    which is how publish-status.yml accumulated 0 successes over its
      #    entire life while looking perfectly reasonable in the editor.
      - name: No workflow declares a reserved secret name
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(f)) or {}
              on = d.get(True) or d.get("on") or {}
              for name in ((on.get("workflow_call") or {}).get("secrets") or {}):
                  if name.upper() == "GITHUB_TOKEN":
                      bad.append(f"{f}: declares reserved secret '{name}'")
          for b in bad:
              print("  " + b)
          if bad:
              print("\nGITHUB_TOKEN is provided automatically. For cross-repo")
              print("access use a differently named PAT secret.")
              sys.exit(1)
          print("no reserved secret names")
          PY

      # 5. Reusable workflows are the blast radius, so their inputs and secrets
      #    are a contract. A workflow_call file with neither is usually a file
      #    that was edited without thinking about its callers.
      - name: Every reusable workflow declares its interface
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(f))
              on = d.get(True) or d.get("on") or {}
              if "workflow_call" not in on:
                  continue
              call = on["workflow_call"] or {}
              if not call.get("inputs") and not call.get("secrets"):
                  bad.append(f)
          for f in bad:
              print(f"  {f}: workflow_call with no inputs and no secrets")
          sys.exit(1 if bad else 0)
          PY
